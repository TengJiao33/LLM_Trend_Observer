name: Daily LLM Trend Report

on:
  schedule:
    # Requested start: 10:17 Asia/Shanghai. GitHub may delay scheduled jobs.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: llm-trend-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect and send report
        id: pipeline
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python main.py --notify
      - name: Preserve collection evidence
        if: always() && steps.pipeline.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: leaderboard-observations-${{ github.run_id }}
          path: |
            data/*_current.json
            data/source_status.json
            reports/latest_report.md
          retention-days: 30
      - name: Commit reports and successful observations
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "Update leaderboard observations and report [skip ci]"
            git push
          fi
      - name: Fail when collection or notification was degraded
        if: always() && steps.pipeline.outcome == 'failure'
        run: exit 1
